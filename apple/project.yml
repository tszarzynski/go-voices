name: GoVoices
packages:
  Shared:
    path: ./generated/Shared
  App:
    path: ./generated/App
options:
  bundleIdPrefix: com.tszarzynski.govoices
attributes:
  BuildIndependentTargetsInParallel: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

targetTemplates:
  GoVoices:
    type: application
    sources:
      - path: GoVoices
        excludes:
          - "Info-*.plist"
          - "*.entitlements"
    scheme:
      management:
        shared: true
    dependencies:
      - package: Shared
      - package: App
      - sdk: CoreMIDI.framework
    settings:
      PRODUCT_NAME: GoVoices
      MARKETING_VERSION: 0.2.0 # as the core's
      CURRENT_PROJECT_VERSION: 1
      PRODUCT_BUNDLE_IDENTIFIER: com.tszarzynski.govoices
      OTHER_LDFLAGS: [-w]
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor # the GO:KEYS red, GoKeys.accent

targets:
  GoVoices-iOS:
    templates: [GoVoices]
    platform: iOS
    deploymentTarget: "18.0"
    dependencies:
      - sdk: CoreAudioKit.framework
    info:
      path: GoVoices/Info-iOS.plist
      properties:
        CFBundleDisplayName: Go:Voices
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: Go:Voices pairs with your Bluetooth MIDI keyboard to send it sounds.
        UILaunchScreen: {}
        # iPhone: portrait only, for now; the arrangement leaves no room for the list in landscape.
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      TARGETED_DEVICE_FAMILY: "1,2"
  GoVoices-macOS:
    templates: [GoVoices]
    platform: macOS
    deploymentTarget: "15.0"
    info:
      path: GoVoices/Info-macOS.plist
      properties:
        CFBundleDisplayName: Go:Voices
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Go:Voices
        LSApplicationCategoryType: public.app-category.music
        NSBluetoothAlwaysUsageDescription: Go:Voices sends sounds to your Bluetooth MIDI keyboard.
