[package]
name = "shared_ffi"
version = "0.1.0"
description = "The BoltFFI bridge to the GO Voices core for the Swift shell, and the type generator"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

# A separate crate so that `shared` stays a plain library: Cargo builds every
# crate-type a dependency declares, and a staticlib can't build for the
# Cardputer.
[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "codegen"
required-features = ["codegen"]

[features]
facet_typegen = ["shared/facet_typegen"]
codegen = [
    "dep:anyhow",
    "dep:clap",
    "dep:log",
    "dep:pretty_env_logger",
    "facet_typegen",
]

[dependencies]
boltffi.workspace = true
crux_core = { workspace = true, features = ["std", "bridge"] }
shared = { path = "../shared" }

# codegen only
anyhow = { workspace = true, optional = true }
clap = { version = "4.6.6", optional = true, features = ["derive"] }
log = { version = "0.4.33", optional = true }
pretty_env_logger = { version = "0.5.0", optional = true }
