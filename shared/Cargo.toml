[package]
name = "shared"
version = "0.1.0"
description = "GO Voices' Crux core: browse the GO:KEYS sounds and send them over MIDI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# On by default. Turn it off to build the core for an embedded target.
default = ["std"]
std = ["catalogue/std", "crux_midi/std", "crux_core/std", "facet/std", "futures/std", "serde/std", "serde_json/std"]
facet_typegen = ["std", "crux_core/facet_typegen"]

[dependencies]
catalogue.workspace = true
crux_core.workspace = true
crux_midi.workspace = true
facet.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
crux_core = { workspace = true, features = ["testing"] }
